[package]
name = "beatstudio"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = "=0.15.3"
png = "=0.17.16"

[profile.dev]
debug = false
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
