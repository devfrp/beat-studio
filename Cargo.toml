[package]
name = "beatstudio"
version = "0.1.1"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Un petit studio de musique pour Linux, inspiré de FL Studio"
repository = "https://github.com/devfrp/beat-studio"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = "=0.15.3"
png = "=0.17.16"
midir = "=0.11.1"
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis", "adpcm"] }

[profile.dev]
debug = false
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
