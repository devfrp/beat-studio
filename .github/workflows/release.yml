# Builds Beat Studio for Linux (AppImage), Windows (.exe) and macOS
# (universal .app). A pushed tag "v*" also publishes a GitHub release with
# the files; started by hand ("Run workflow"), it only builds them.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # An older Ubuntu: the AppImage then runs on older distributions too (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Tests
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps dist
          cp target/release/beatstudio AppDir/usr/bin/
          cp packaging/beatstudio.desktop AppDir/
          cp packaging/beatstudio.desktop AppDir/usr/share/applications/
          cp packaging/beatstudio.png AppDir/
          cp packaging/beatstudio.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp packaging/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir dist/BeatStudio-x86_64.AppImage
          tar -czf dist/BeatStudio-linux-x86_64.tar.gz -C target/release beatstudio -C ../.. README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/beatstudio.exe dist/BeatStudio-windows-x86_64.exe
          New-Item -ItemType Directory -Force pkg/BeatStudio | Out-Null
          Copy-Item target/release/beatstudio.exe, README.md, LICENSE pkg/BeatStudio/
          Compress-Archive -Path pkg/BeatStudio -DestinationPath dist/BeatStudio-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    # macOS 14 machines were taken away by GitHub; 15 runs universal builds.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: App bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION=0.0.0 ;; esac
          APP="dist/Beat Studio.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/beatstudio" \
            target/aarch64-apple-darwin/release/beatstudio target/x86_64-apple-darwin/release/beatstudio
          sed "s/@VERSION@/$VERSION/g" packaging/Info.plist > "$APP/Contents/Info.plist"
          mkdir beatstudio.iconset
          for s in 16 32 128 256; do
            sips -z $s $s packaging/beatstudio.png --out beatstudio.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $((s*2)) $((s*2)) packaging/beatstudio.png --out beatstudio.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns beatstudio.iconset -o "$APP/Contents/Resources/beatstudio.icns"
          codesign --force --deep --sign - "$APP"
          cd dist && ditto -c -k --keepParent "Beat Studio.app" BeatStudio-macos-universal.zip && rm -rf "Beat Studio.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Beat Studio ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md
